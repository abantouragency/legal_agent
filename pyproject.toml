[project]
name = "legal-agent"
version = "0.1.0"
description = "RAG-based Persian legal assistant agent (Telegram + cloud LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "numpy>=2.4.6",
    "openai>=2.53.0",
    "pypdf>=6.14.2",
    "python-telegram-bot>=22.8",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
