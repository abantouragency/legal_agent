# Render deployment blueprint for the legal agent.
# Connect this repo to Render (https://dashboard.render.com) and create a
# "Blueprint" from it; the web service below will deploy automatically.
#
# Required environment variables (set in Render dashboard -> Environment):
#   BOT_TOKEN            Telegram bot token from @BotFather
#   OPENAI_API_KEY       OpenAI API key (charged account)
#   CHANNEL_ID           -100xxxxxxxxx (the institute channel, bot must be admin)
#   ADMIN_IDS            67391189,125472442  (comma-separated Telegram user ids)
#   MODEL                gpt-4o-mini (optional)
#
# NOTE ON PERSISTENCE (free tier):
#   Render's free web service does NOT support mounted disks and spins down
#   after 15 min idle. Without a disk, chroma rebuilds from the seed jsonl on
#   each start (costs a small amount of OpenAI embedding quota, but works).
#   For a true 24/7 always-on bot with a persisted vector DB, use the paid
#   "Starter" plan and uncomment the `disks:` block below (and set DATA_DIR).
#
# REGION: on the FREE plan only `oregon` is available. frankfurt/singapore are
# paid-only and will cause a blueprint validation error.
services:
  - type: web
    name: legal-agent
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: "/data"
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: MODEL
        value: gpt-4o-mini
    # --- UNCOMMENT FOR PAID PLAN (persistent vector DB) ---
    # disks:
    #   - name: chroma-data
    #     mountPath: /data
    #     sizeGB: 1
